name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (credential lookup, tools, system prompt, client)
        run: npm test

      # Note: the live smoke test (npm run agent:test) is intentionally NOT
      # run here. It depends on a real ~/.gg/auth.json token and a network
      # call to https://api.minimax.io/anthropic, which is an environment
      # concern, not a CI concern. Run it manually before releasing.
