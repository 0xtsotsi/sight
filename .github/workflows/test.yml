name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # --legacy-peer-deps works around an ERESOLVE conflict between
        # openai@4 (peer zod@^3.23.8) and @kenkaiiii/gg-agent@5.30.3
        # (peer zod@^4.4.3). Both peers resolve at runtime; the conflict
        # is purely a peer-dep metadata mismatch in the upstream openai
        # package. Remove this flag once openai ships a major version
        # that accepts zod@4.
        run: npm ci --legacy-peer-deps

      - name: Run unit tests (credential lookup, tools, system prompt, client)
        run: npm test

      # Note: the live smoke test (npm run agent:test) is intentionally NOT
      # run here. It depends on a real ~/.gg/auth.json token and a network
      # call to https://api.minimax.io/anthropic, which is an environment
      # concern, not a CI concern. Run it manually before releasing.
