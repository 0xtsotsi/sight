name: Release (unsigned)

# Test/dev-build variant of release-pipeline.yml. Skips macOS code-signing
# and notarization so dev/test builds can run without Apple Developer
# credentials. Triggers on `dev-v*` tags so they don't collide with the
# production `v*` tags handled by release-pipeline.yml.
#
# Use cases:
#   - Internal testing on a fresh checkout
#   - Verifying the build pipeline before committing to a real release
#   - Sharing unsigned artifacts with a small group who can right-click
#     → Open to bypass Gatekeeper
#
# Out of scope:
#   - Public releases (use release-pipeline.yml with the signing secrets
#     set as repo secrets)
#   - Auto-update delivery to end users (Sight's auto-updater expects
#     signed assets from release-pipeline.yml)
#
# Manual usage:  gh workflow run release-pipeline-unsigned.yml --ref main
on:
  push:
    tags:
      - 'dev-v*'
  workflow_dispatch: {}

jobs:
  # Create the draft release on sight-releases BEFORE the build jobs try
  # to upload. Without this, electron-builder's --publish always fails
  # with HTTP 404 because no release exists yet for the tag.
  setup-release:
    runs-on: ubuntu-latest
    outputs:
      tag_version: ${{ steps.resolve.outputs.tag_version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # For workflow_dispatch, ref_name is refs/heads/main. For tag
          # pushes, ref_name is dev-vX.Y.Z. Derive version either way.
          if [[ "$TAG" == dev-v* ]]; then
            tag_version="${TAG#dev-v}"
          else
            tag_version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
          fi
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Create draft release on sight-releases (idempotent)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ steps.resolve.outputs.tag_version }}
        run: |
          set -euo pipefail
          # electron-builder uploads to a release matching package.json's
          # version (vX.Y.Z). We pre-create that release as a draft+prerelease
          # so the unsigned build never accidentally becomes 'latest'.
          full_tag="v${TAG_VERSION}"
          status=$(gh release view "$full_tag" --repo 0xtsotsi/sight-releases --json name -q '.name' 2>/dev/null || echo '')
          if [ -z "$status" ]; then
            echo "Creating draft release $full_tag"
            gh release create "$full_tag" \
              --repo 0xtsotsi/sight-releases \
              --title "Sight ${full_tag} (unsigned)" \
              --notes "Unsigned test build of Sight v${TAG_VERSION}. Marked pre-release so the Sight auto-updater won't deliver to end users." \
              --draft \
              --prerelease
          else
            echo "Release $full_tag already exists (electron-builder will reuse it)"
          fi

  build-mac:
    needs: setup-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Build unsigned macOS app (no signing, no notarization)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Single-line run (no bash-style line continuations) for cross-shell
        # compatibility — Windows runners use PowerShell which doesn't
        # honor `\` at end-of-line the same way bash does.
        run: npx electron-builder --mac --publish always -c.mac.forceCodeSigning=false -c.mac.notarize=false -c.mac.identity=null

  build-windows:
    needs: setup-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Build unsigned Windows app
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  # Only now does the release become visible, marked as a pre-release so
  # the Sight auto-updater won't push it to end users.
  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
          # For dev-v* tag pushes: TAG is 'dev-vX.Y.Z' and we strip the prefix.
          # For workflow_dispatch from a branch: TAG is the branch name (no
          # version), so skip the comparison — the release tag is whatever
          # setup-release derived from package.json, which by construction
          # matches.
          if [[ "$TAG" == dev-v* ]]; then
            tag_version="${TAG#dev-v}"
            if [ "$pkg" != "$tag_version" ]; then
              echo "✗ package.json version ($pkg) does not match tag ($TAG)"
              echo "  Refusing to publish. Re-tag the right commit, or fix package.json."
              exit 1
            fi
            echo "✓ package.json version ($pkg) matches tag ($TAG)"
          else
            echo "• workflow_dispatch from branch $TAG — skipping drift check"
            echo "  release tag is dev-v${pkg} (set by setup-release)"
          fi

      - name: Verify both platforms uploaded, then publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # electron-builder always uploads to a release named after the
          # package.json version (vX.Y.Z), regardless of the workflow tag.
          # The setup-release job pre-created a draft at the same vX.Y.Z
          # name so electron-builder has somewhere to upload. We find it
          # by listing releases and looking for the vX.Y.Z draft.
          pkg=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
          expected="v${pkg}"
          echo "Looking for release $expected on sight-releases"
          # If our draft is named differently (e.g. dev-vX.Y.Z) we need to
          # rename the underlying release so end users don't see "draft"
          # for a signed release. For now, we look up by package.json.
          release_json=$(gh release view "$expected" --repo 0xtsotsi/sight-releases --json assets,name,isDraft,isPrerelease 2>/dev/null || echo '{}')
          assets=$(echo "$release_json" | jq -r '(.assets // []) | map(.name) | join(" ")')
          echo "release name: $(echo "$release_json" | jq -r '.name // "not found"')"
          echo "assets: $assets"
          if [ -z "$assets" ] || [ "$assets" = "null" ]; then
            echo "✗ release $expected has no assets — refusing to publish"
            echo "  This usually means electron-builder uploaded to a"
            echo "  different release than expected (check setup-release)."
            exit 1
          fi
          for required in latest-mac.yml latest.yml; do
            case " $assets " in
              *" $required "*) ;;
              *) echo "missing $required — refusing to publish"; exit 1 ;;
            esac
          done
          echo "✓ asset check passed; marking release as pre-release"
          # Unsigned releases must never become 'latest' (Sight auto-updater
          # would push to end users). Pre-release is the safe choice.
          gh release edit "$expected" --repo 0xtsotsi/sight-releases \
            --draft=false \
            --prerelease

      - name: Notify via Discord (if webhook configured)
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "no DISCORD_RELEASE_WEBHOOK secret set; skipping"
            exit 0
          fi
          payload=$(printf '{"content":"🧪 Sight %s (unsigned/pre-release) — https://github.com/0xtsotsi/sight-releases/releases/tag/%s"}' "$TAG" "$TAG")
          curl -fsS -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK" \
            || { echo "webhook post failed (non-fatal)"; }
