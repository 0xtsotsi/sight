name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci
      - run: npm run build
      - name: Validate mac signing secrets
        run: |
          test -n "$MAC_CSC_LINK" || { echo "MAC_CSC_LINK is missing"; exit 1; }
          test -n "$MAC_CSC_KEY_PASSWORD" || { echo "MAC_CSC_KEY_PASSWORD is missing"; exit 1; }
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      - run: npx electron-builder --mac --publish always
        env:
          DEBUG: electron-osx-sign*,electron-builder
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: "data:application/x-pkcs12;base64,${{ secrets.MAC_CSC_LINK }}"
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EP_PRE_RELEASE: false
          # Upload into a draft. A release that is visible before every
          # platform has uploaded becomes "latest" with only some of its
          # assets, and the other platform's updater 404s on its missing
          # channel file. The publish job below flips the draft once both
          # builds have landed.
          EP_DRAFT: true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          EP_PRE_RELEASE: false
          EP_DRAFT: true

  # Only now does the release become visible to updaters, with mac and
  # Windows assets both present.
  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json","utf8")).version)')
          # Tag should be vX.Y.Z; strip the leading 'v'.
          tag_version="${TAG#v}"
          if [ "$pkg" != "$tag_version" ]; then
            echo "✗ package.json version ($pkg) does not match tag ($TAG)"
            echo "  Refusing to publish. Re-tag the right commit, or fix package.json."
            exit 1
          fi
          echo "✓ package.json version ($pkg) matches tag ($TAG)"

      - name: Verify both platforms uploaded, then publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --repo 0xtsotsi/sight-releases \
            --json assets --jq '[.assets[].name] | join(" ")')
          echo "assets: $assets"
          for required in latest-mac.yml latest.yml; do
            case " $assets " in
              *" $required "*) ;;
              *) echo "missing $required — refusing to publish"; exit 1 ;;
            esac
          done
          # Post a release-notes summary as a comment on the bump commit (if
          # we can identify it). Best-effort — skipped if the bump commit
          # can't be resolved.
          echo "✓ asset check passed; flipping draft to published"
          gh release edit "$TAG" --repo 0xtsotsi/sight-releases --draft=false --latest

      - name: Notify via Discord (if webhook configured)
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "no DISCORD_RELEASE_WEBHOOK secret set; skipping"
            exit 0
          fi
          payload=$(printf '{"content":"🚀 Sight %s released — see https://github.com/0xtsotsi/sight-releases/releases/tag/%s"}' "$TAG" "$TAG")
          curl -fsS -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK" \
            || { echo "webhook post failed (non-fatal)"; }
